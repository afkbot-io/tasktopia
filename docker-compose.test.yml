services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasktopia_test
      POSTGRES_USER: tasktopia
      POSTGRES_PASSWORD: tasktopia
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktopia -d tasktopia_test"]
      interval: 2s
      timeout: 3s
      retries: 15
