name: verify

on:
  # Feature branches are verified by pull_request. Restrict push verification
  # to main so the same SHA does not run this stateful, asset-heavy job twice.
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Asset regeneration, the full unit suite, and the ultra-wide streaming
    # browser gate intentionally run together and exceed 15 minutes on hosted
    # runners. The complete matrix measured 44+ minutes, leaving no margin
    # under the old 45-minute job ceiling. This only bounds the whole job;
    # browser readiness, simulation and performance budgets stay in each test.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasktopia_test
          POSTGRES_USER: tasktopia
          POSTGRES_PASSWORD: tasktopia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tasktopia -d tasktopia_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
      DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets:setup && npm run assets:build && npm run assets:verify
      - run: npm run typecheck
      - run: npm run lint
      # Stateful PostgreSQL fixtures share one seeded database. File-parallel
      # execution makes unrelated MCP/deployment cases contend and intermittently
      # exceed their per-test timeout on hosted runners.
      - run: npm test -- --no-file-parallelism
      - name: Compact database backup and recovery
        run: |
          pg_image_id="$(docker image inspect postgres:16-alpine --format '{{.Id}}')"
          python3 tests/compact_cutover_database_integration.py --pg-image "$pg_image_id"
      - name: Compact host maintenance and writer freeze
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx-light
          pg_image_id="$(docker image inspect postgres:16-alpine --format '{{.Id}}')"
          python3 tests/compact_cutover_host_integration.py --nginx /usr/sbin/nginx --image "$pg_image_id"
      - run: npm run build
      - name: MCP protocol and authentication smoke
        run: |
          npm run seed:test
          npm start > /tmp/tasktopia-mcp-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          npm run smoke:mcp
        env:
          NODE_ENV: production
          SESSION_COOKIE_SECURE: "false"
          APP_ORIGIN: http://127.0.0.1:3000
      - run: npx playwright install --with-deps chromium webkit
      # Emit each failure immediately: the compact reporter buffers details
      # until the end, losing diagnostics if the overall job times out. A
      # failing run stops after three failures; a passing run still runs the
      # entire browser matrix and all following gates.
      - run: npm run test:e2e -- --reporter=line --max-failures=3
        env:
          CI: "true"
          SEED_PRINT_TOKEN: "false"
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - run: npm audit --audit-level=high
