name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Asset regeneration, the full unit suite, and the ultra-wide streaming
    # browser gate intentionally run together and exceed 15 minutes on hosted
    # runners. Keep a bounded ceiling without cancelling a healthy release.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasktopia_test
          POSTGRES_USER: tasktopia
          POSTGRES_PASSWORD: tasktopia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tasktopia -d tasktopia_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
      DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets:setup && npm run assets:build && npm run assets:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: MCP protocol and authentication smoke
        run: |
          npm run seed:test
          npm start > /tmp/tasktopia-mcp-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          npm run smoke:mcp
        env:
          NODE_ENV: production
          SESSION_COOKIE_SECURE: "false"
          APP_ORIGIN: http://127.0.0.1:3000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SEED_PRINT_TOKEN: "false"
      - run: npm audit --audit-level=high

  worldgen:
    # World generation is intentionally isolated from the regular and browser
    # suites: it is resource-heavy and must not compete with them in one job.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasktopia_test
          POSTGRES_USER: tasktopia
          POSTGRES_PASSWORD: tasktopia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tasktopia -d tasktopia_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
      DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:worldgen
      - name: Clean-install seed smoke (1 city, 10 districts)
        run: npm run seed
        env:
          SEED_PRINT_TOKEN: "false"

  atlas:
    # The country atlas uses a dedicated ten-city fixture. Keeping it out of
    # the stateful default E2E seed prevents accidental dependence on local DB
    # leftovers while retaining full hover/navigation coverage in CI. Hosted
    # runners can need more than 15 minutes to generate all ten cities before
    # the browser assertions begin, so keep the same bounded release ceiling as
    # the primary verification job.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasktopia_test
          POSTGRES_USER: tasktopia
          POSTGRES_PASSWORD: tasktopia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tasktopia -d tasktopia_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
      DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:atlas
