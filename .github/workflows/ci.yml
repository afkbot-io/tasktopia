name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasktopia_test
          POSTGRES_USER: tasktopia
          POSTGRES_PASSWORD: tasktopia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tasktopia -d tasktopia_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
      DATABASE_URL: postgres://tasktopia:tasktopia@127.0.0.1:55432/tasktopia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets:setup && npm run assets:build && npm run assets:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SEED_PRINT_TOKEN: "false"
      - run: npm audit --audit-level=high
